name: CI – Dev Build & Test

# Se activa cuando cualquiera de los dos submódulos hace push a dev
on:
  push:
    branches:
      - dev
  repository_dispatch:
    types: [submodule_updated]

permissions:
  contents: write

jobs:

  check-branch:
    runs-on: ubuntu-latest
    outputs:
      is-dev: ${{ steps.check.outputs.is-dev }}
    steps:
      - name: Check if event is from dev branch
        id: check
        run: |
          if [ "${{ github.event.client_payload.branch }}" = "dev" ]; then
            echo "is-dev=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-dev=false" >> "$GITHUB_OUTPUT"
          fi


  # ============================================
  # Front (nuevo, Angular 22): lint, unitarios con cobertura y build
  # ============================================
  front-ci:
    needs: check-branch
    if: needs.check-branch.outputs.is-dev == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout front (repo nuevo, rama dev)
        run: git clone --branch dev https://x-access-token:${{ secrets.FRONTEND_REPO_PAT }}@github.com/Aragorn7372/front-encordados.git front

      # Angular 22 pide Node ^22.22.3 o ^24.15
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Lint
        working-directory: front
        run: npm run lint

      - name: Unit tests (Vitest) con cobertura
        working-directory: front
        run: npm run test:coverage

      - name: Build (production)
        working-directory: front
        run: npm run build

      # El build es lo que prueban los e2e; el informe de Vitest va a dev-test con los del back
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: front-dist
          path: front/dist
          retention-days: 3

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: front-unit-report
          path: front/.vitest

  # ============================================
  # Front: e2e (Playwright, 2 workers) contra el back con bases de datos en memoria
  # ============================================
  front-e2e:
    needs: [front-ci, build-back]
    runs-on: ubuntu-latest
    env:
      LANG: es_ES.UTF-8
      LC_ALL: es_ES.UTF-8

    steps:
      - name: Install Spanish locale
        run: |
          sudo locale-gen es_ES.UTF-8
          sudo update-locale LANG=es_ES.UTF-8 LC_ALL=es_ES.UTF-8

      - name: Checkout back-encordados
        run: git clone --branch dev https://x-access-token:${{ secrets.BACKEND_REPO_PAT }}@github.com/Aragorn7372/back-encordados.git back-encordados

      - name: Checkout front (repo nuevo, rama dev)
        run: git clone --branch dev https://x-access-token:${{ secrets.FRONTEND_REPO_PAT }}@github.com/Aragorn7372/front-encordados.git front

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Development=true (por defecto): bases de datos en memoria con los seeds, cada ejecución
      # empieza limpia. Es el mismo backend que usan los tests de Bruno
      - name: Start API server in background
        working-directory: back-encordados/BackEncordados
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          Cloudinary__CloudName: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          Cloudinary__ApiKey: ${{ secrets.CLOUDINARY_API_KEY }}
          Cloudinary__ApiSecret: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          dotnet run --no-launch-profile --urls "http://localhost:5032" &>/tmp/api.log &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5032/health >/dev/null 2>&1; then
              echo "API ready on :5032"
              exit 0
            fi
            echo "Waiting for API... ($((i*2))s)"
            sleep 2
          done
          echo "La API no arrancó:"; tail -50 /tmp/api.log; exit 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: front-dist
          path: front/dist

      - name: Install Playwright (Chromium)
        working-directory: front
        run: npx playwright install --with-deps chromium

      # CI=1: un reintento por test y prohibido dejar un test.only
      - name: Run e2e
        working-directory: front
        env:
          CI: "1"
          E2E_API: http://localhost:5032
        run: npm run e2e

      - name: API log (si algo falla)
        if: failure()
        run: tail -100 /tmp/api.log

      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: front-e2e-report
          path: front/e2e/informe

      - name: Upload e2e traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: front-e2e-trazas
          path: front/e2e/resultados
          retention-days: 7


  build-back:
    needs: check-branch
    if: needs.check-branch.outputs.is-dev == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout monorepo (with submodules)
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: false
        
      - name: Checkout back-encordados submodule
        run: git clone --branch dev https://x-access-token:${{ secrets.BACKEND_REPO_PAT }}@github.com/Aragorn7372/back-encordados.git back-encordados
      
      - name: Debug directory
        run: |
           pwd
           ls -la
           ls -la back-encordados/

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet packages
        working-directory: back-encordados
        run: dotnet restore BackEncordados.slnx

      - name: Build solution
        working-directory: back-encordados
        run: dotnet build BackEncordados.slnx --no-restore -c Release

  test-back:
    needs: build-back
    runs-on: ubuntu-latest
    env:
      LANG: es_ES.UTF-8
      LC_ALL: es_ES.UTF-8
    steps:
      - name: Install Spanish locale
        run: |
          sudo locale-gen es_ES.UTF-8
          sudo update-locale LANG=es_ES.UTF-8 LC_ALL=es_ES.UTF-8
      - name: Checkout monorepo (with submodules)
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: false
        
      - name: Checkout back-encordados submodule
        run: git clone --branch dev https://x-access-token:${{ secrets.BACKEND_REPO_PAT }}@github.com/Aragorn7372/back-encordados.git back-encordados

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet packages
        working-directory: back-encordados
        run: dotnet restore BackEncordados.slnx

      - name: Run unit tests with Coverlet (Cobertura)
        working-directory: back-encordados
        run: |
          dotnet test TestEncordados/TestEncordados.csproj \
            --no-restore \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate HTML coverage report
        working-directory: back-encordados
        run: |
          COVERAGE_FILE=$(find TestResults -name "coverage.cobertura.xml" | head -1)
          echo "Coverage file: $COVERAGE_FILE"
          reportgenerator \
            "-reports:$COVERAGE_FILE" \
            "-targetdir:coverage-report" \
            "-reporttypes:Html;Badges;Cobertura"

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: back-encordados/coverage-report

  integration-test:
    needs: build-back
    runs-on: ubuntu-latest
    env:
      LANG: es_ES.UTF-8
      LC_ALL: es_ES.UTF-8

    steps:
      - name: Install Spanish locale
        run: |
          sudo locale-gen es_ES.UTF-8
          sudo update-locale LANG=es_ES.UTF-8 LC_ALL=es_ES.UTF-8

      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: false

      - name: Checkout back-encordados submodule
        run: |
          git clone --branch dev \
            https://x-access-token:${{ secrets.BACKEND_REPO_PAT }}@github.com/Aragorn7372/back-encordados.git \
            back-encordados

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore & Build API
        working-directory: back-encordados
        run: |
          dotnet restore BackEncordados.slnx
          dotnet build BackEncordados.slnx --no-restore -c Release

      - name: Start API server in background
        working-directory: back-encordados/BackEncordados
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          Cloudinary__CloudName: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          Cloudinary__ApiKey: ${{ secrets.CLOUDINARY_API_KEY }}
          Cloudinary__ApiSecret: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          dotnet run --urls "http://localhost:5032" &>/tmp/api.log &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5032/health >/dev/null 2>&1; then
              echo "API ready on :5032"
              break
            fi
            echo "Waiting for API... ($((i*2))s)"
            sleep 2
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Run Bruno integration tests
        continue-on-error: true
        working-directory: back-encordados/bruno-cli
        run: |
          bru run \
            --env local \
            --output ../../bruno-integration-report \
            --format html

      - name: Upload Bruno report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bruno-integration-report
          path: bruno-integration-report

  deploy-reports:
    needs: [test-back, integration-test, front-ci, front-e2e]
    # Los informes se publican también si los e2e fallan: es cuando más se miran
    if: always() && needs.test-back.result == 'success' && needs.front-ci.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev-test branch
        uses: actions/checkout@v4
        with:
          ref: dev-test
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: generated/coverage

      - name: Download Bruno report
        uses: actions/download-artifact@v4
        with:
          name: bruno-integration-report
          path: generated/bruno

      - name: Download front unit test report
        uses: actions/download-artifact@v4
        with:
          name: front-unit-report
          path: generated/front-unit

      - name: Download front e2e report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: front-e2e-report
          path: generated/front-e2e

      - name: Deploy reports to dev-test
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: generated
          branch: dev-test
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Deploy coverage & Bruno test reports [skip ci]"
