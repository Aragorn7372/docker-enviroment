name: CI – Dev Build & Test

# Se activa cuando cualquiera de los dos submódulos hace push a dev
on:
  push:
    branches:
      - dev
  repository_dispatch:
    types: [submodule_updated]

permissions:
  contents: write

jobs:

  check-branch:
    runs-on: ubuntu-latest
    outputs:
      is-dev: ${{ steps.check.outputs.is-dev }}
    steps:
      - name: Check if event is from dev branch
        id: check
        run: |
          if [ "${{ github.event.client_payload.branch }}" = "dev" ]; then
            echo "is-dev=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-dev=false" >> "$GITHUB_OUTPUT"
          fi


  build-front:
    needs: check-branch
    if: needs.check-branch.outputs.is-dev == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout monorepo (with submodules)
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: false
        
      - name: Checkout front-encordados submodule
        run: git clone --branch dev https://x-access-token:${{ secrets.FRONTEND_REPO_PAT }}@github.com/JorgeMrj/front-encordados.git front-encordados
     
      - name: Debug directory
        run: |
           pwd
           ls -la
           ls -la back-encordados/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-encordados/package-lock.json

      - name: Install dependencies
        working-directory: front-encordados
        run: npm ci --legacy-peer-deps

      - name: Build Angular (production)
        working-directory: front-encordados
        run: npm run build -- --configuration production


  build-back:
    needs: check-branch
    if: needs.check-branch.outputs.is-dev == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout monorepo (with submodules)
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: false
        
      - name: Checkout back-encordados submodule
        run: git clone --branch dev https://x-access-token:${{ secrets.BACKEND_REPO_PAT }}@github.com/Aragorn7372/back-encordados.git back-encordados
      
      - name: Debug directory
        run: |
           pwd
           ls -la
           ls -la back-encordados/

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet packages
        working-directory: back-encordados
        run: dotnet restore BackEncordados.slnx

      - name: Build solution
        working-directory: back-encordados
        run: dotnet build BackEncordados.slnx --no-restore -c Release

  test-back:
    needs: build-back
    runs-on: ubuntu-latest
    env:
      LANG: es_ES.UTF-8
      LC_ALL: es_ES.UTF-8
    steps:
      - name: Install Spanish locale
        run: |
          sudo locale-gen es_ES.UTF-8
          sudo update-locale LANG=es_ES.UTF-8 LC_ALL=es_ES.UTF-8
      - name: Checkout monorepo (with submodules)
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: false
        
      - name: Checkout back-encordados submodule
        run: git clone --branch dev https://x-access-token:${{ secrets.BACKEND_REPO_PAT }}@github.com/Aragorn7372/back-encordados.git back-encordados

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet packages
        working-directory: back-encordados
        run: dotnet restore BackEncordados.slnx

      - name: Run unit tests with Coverlet (Cobertura)
        working-directory: back-encordados
        run: |
          dotnet test TestEncordados/TestEncordados.csproj \
            --no-restore \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate HTML coverage report
        working-directory: back-encordados
        run: |
          COVERAGE_FILE=$(find TestResults -name "coverage.cobertura.xml" | head -1)
          echo "Coverage file: $COVERAGE_FILE"
          reportgenerator \
            "-reports:$COVERAGE_FILE" \
            "-targetdir:coverage-report" \
            "-reporttypes:Html;Badges;Cobertura"

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
            name: coverage-report
            path: back-encordados/coverage-report

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
            name: coverage-report
            path: generated/coverage

      - name: Publish API for Bruno tests
        working-directory: back-encordados
        run: dotnet publish BackEncordados.slnx --no-restore -c Release -o ./publish

      - name: Start API in background for Bruno tests
        working-directory: back-encordados
        run: |
          nohup dotnet ./publish/BackEncordados.dll > ./api.log 2>&1 &
          echo "PID=$!"
        env:
          ASPNETCORE_ENVIRONMENT: "Development"
          ASPNETCORE_URLS: "http://localhost:5032"
          Development: "true"
          App__WhatsAppEnabled: "false"
          JWT__KEY: ${{ secrets.JWT_KEY_CI }}
          Cloudinary__CloudName: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          Cloudinary__ApiKey: ${{ secrets.CLOUDINARY_API_KEY }}
          Cloudinary__ApiSecret: ${{ secrets.CLOUDINARY_API_SECRET }}

      - name: Wait for API ready
        working-directory: back-encordados
        run: |
           echo "Waiting for API to be ready..."
           for i in $(seq 1 30); do
           status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5032/health 2>/dev/null || true)
            if [ "$status" = "200" ]; then
            echo "API is ready after $i attempts!"
            exit 0
            fi
            echo "Attempt $i/30: status=$status, waiting 2s..."
             sleep 2
            done
            echo "API failed to start within 60s"
            cat back-encordados/api.log
            exit 1

      - name: Setup Node.js for Bruno CLI
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli
      - name: Warm up API
        run: |
           sleep 3
           curl -s http://localhost:5032/health > /dev/null || true
      - name: Run Bruno API tests
        working-directory: back-encordados/EncordadosBruno
        run: bru run --env local --reporter-html bruno-report.html --insecure --verbose

      - name: Copy Bruno report to generated/
        run: cp back-encordados/EncordadosBruno/bruno-report.html generated/bruno-report.html

      - name: Deploy to dev-test branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
            folder: generated
            branch: dev-test
            token: ${{ secrets.GITHUB_TOKEN }}